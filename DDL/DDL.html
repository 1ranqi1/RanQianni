<section id="ddl-view" class="content-card" aria-labelledby="ddl-heading">
  <div class="ddl-head">
    <div>
      <h2 id="ddl-heading">DDL · 作业安排</h2>
    </div>
    <div class="ddl-head-actions"><span id="ddl-count" class="ddl-count">0 项作业</span><button id="ddl-add-button" class="small-primary" type="button">＋ 添加作业</button></div>
  </div>
  <form id="ddl-form" class="ddl-form hidden">
    <div class="ddl-field"><label for="ddl-course">课程</label><input id="ddl-course" type="text" maxlength="80" required placeholder="例如：高等量子力学"></div>
    <div class="ddl-field"><label for="ddl-deadline">作业结束时间</label><input id="ddl-deadline" type="datetime-local" step="60" required></div>
    <div class="ddl-field ddl-wide"><label for="ddl-content">作业内容</label><textarea id="ddl-content" rows="3" maxlength="1000" required placeholder="写下作业要求"></textarea></div>
    <div class="ddl-field ddl-wide"><label for="ddl-address">提交地址</label><input id="ddl-address" type="text" maxlength="300" placeholder="网址或线下提交地点（可留空）"></div>
    <div class="ddl-actions"><button id="ddl-submit" class="primary" type="submit">添加作业</button><button id="ddl-cancel" class="ghost" type="button">取消</button><button id="ddl-delete" class="danger hidden" type="button">删除</button><span id="ddl-status" class="settings-status" role="status" aria-live="polite"></span></div>
  </form>
  <div id="ddl-list" class="ddl-list"></div>
</section>
