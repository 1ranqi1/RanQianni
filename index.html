/* ===== 拖拽排序 ===== */
.website-table .drag-cell{width:34px;padding-right:0;text-align:center}
.drag-handle{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;color:#a8b3c6;font-size:15px;line-height:1;cursor:grab;user-select:none;transition:.15s}
.drag-handle:hover{background:#eef2fb;color:#5872b9}
.website-table tr[draggable="true"]{cursor:default}
.website-table tr.dragging{opacity:.45}
.website-table tr.dragging .drag-handle{cursor:grabbing}
.website-table tbody tr{transition:background .12s}
.website-table tbody tr:hover{background:#f8faff}
.website-table td{padding-top:9px;padding-bottom:9px}

.site-actions .site-btn:hover{background:#eef2fb;border-color:#c2cfe6;color:#365ac8}
.site-actions .site-btn-danger:hover{background:#fff1f3;border-color:#f0c2c8;color:#c4455a}

(function () {
  const {  $, make, putText  } = __RA;

  const termStart = Date.UTC(2026, 8, 14);
  const timeStorageKey = "ranqi.lessonStartTimes.v1";
  const lessonMinutes = 45;
  const shortBreakMinutes = 5;

  // 默认上课时间（第一次打开或清空设置时使用）
  const defaultStartTimes = {
    1: "08:00",
    3: "09:55",
    6: "13:20",
    8: "15:15",
    11: "18:30",
  };

  let schedule = null;
  let selectedWeek = 0;
  let startTimes = {};

  function todayInShanghai() {
    const parts = new Intl.DateTimeFormat("en-US", {
      timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit"
    }).formatToParts(new Date());
    const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
    return Date.UTC(Number(values.year), Number(values.month) - 1, Number(values.day));
  }

  function currentAcademicWeek() {
    return Math.max(1, Math.min(16, Math.floor((todayInShanghai() - termStart) / 604800000) + 1));
  }

  function weekDates(week) {
    const start = new Date(termStart + (week - 1) * 604800000);
    const end = new Date(termStart + week * 604800000 - 86400000);
    const label = date => `${date.getUTCMonth() + 1} 月 ${date.getUTCDate()} 日`;
    return `${label(start)}—${label(end)}`;
  }

  function readStartTimes() {
    try {
      const raw = localStorage.getItem(timeStorageKey);
      // 从未保存过 → 全部使用默认时间
      if (raw === null) return { ...defaultStartTimes };
      const saved = JSON.parse(raw || "{}");
      if (!saved || typeof saved !== "object" || Array.isArray(saved)) return { ...defaultStartTimes };

      // 逐项校验；用户显式留空的项不补默认值，缺失的项才用默认值补齐
      const result = {};
      for (const key of [1, 3, 6, 8, 11]) {
        const value = saved[key];
        if (typeof value === "string" && /^(?:[01]\d|2[0-3]):[0-5]\d$/.test(value)) {
          result[key] = value;
        } else if (value === undefined) {
          // 数据里压根没有这个时段 → 用默认值
          if (defaultStartTimes[key]) result[key] = defaultStartTimes[key];
        }
        // value === "" 或其他非法值 → 用户清空过，保持空
      }
      return result;
    } catch { return { ...defaultStartTimes }; }
  }

  function saveStartTimes() {
    try {
      localStorage.setItem(timeStorageKey, JSON.stringify(startTimes));
      putText("settings-status", "已自动保存到当前浏览器。");
    } catch {
      putText("settings-status", "当前浏览器无法保存设置；本次打开期间仍可使用。");
    }
  }

  function slotTimeRange(groupFirst, first, last) {
    const start = startTimes[groupFirst];
    if (!start) return "";
    const [hours, minutes] = start.split(":").map(Number);
    const base = hours * 60 + minutes;
    const format = value =>
      `${String(Math.floor(value / 60) % 24).padStart(2, "0")}:${String(value % 60).padStart(2, "0")}`;
    const lessonStart = base + (first - groupFirst) * (lessonMinutes + shortBreakMinutes);
    const lessonEnd = base + (last - groupFirst) * (lessonMinutes + shortBreakMinutes) + lessonMinutes;
    return `${format(lessonStart)}—${format(lessonEnd)}`;
  }

  function buildSettings() {
    const grid = $("settings-grid");
    grid.replaceChildren();

    for (const slot of schedule.slots) {
      const first = Number(slot.id.split("-")[0]);
      const last = Number(slot.id.split("-")[1]);
      const setting = make("div", "time-setting");
      setting.append(make("span", "", slot.label));

      const entry = make("div", "manual-time");
      const hour = document.createElement("input");
      const minute = document.createElement("input");
      for (const input of [hour, minute]) {
        input.type = "text";
        input.inputMode = "numeric";
        input.maxLength = 2;
        input.autocomplete = "off";
      }
      hour.placeholder = "时";
      minute.placeholder = "分";
      hour.setAttribute("aria-label", `${slot.label}起始时间的小时`);
      minute.setAttribute("aria-label", `${slot.label}起始时间的分钟`);
      if (startTimes[first]) [hour.value, minute.value] = startTimes[first].split(":");
      entry.append(hour, make("b", "", ":"), minute);

      const preview = make("small", "time-preview",
        slotTimeRange(first, first, last) || "尚未设置起始时间");

      const save = () => {
        const h = hour.value.trim();
        const m = minute.value.trim();
        if (!h && !m) delete startTimes[first];
        else if (/^\d{1,2}$/.test(h) && /^\d{1,2}$/.test(m) && Number(h) < 24 && Number(m) < 60) {
          startTimes[first] = `${h.padStart(2, "0")}:${m.padStart(2, "0")}`;
          hour.value = h.padStart(2, "0");
          minute.value = m.padStart(2, "0");
        } else {
          putText("settings-status", "请填写有效的小时（0–23）和分钟（0–59）。");
          return;
        }
        saveStartTimes();
        preview.textContent = slotTimeRange(first, first, last) || "尚未设置起始时间";
        drawCourses(selectedWeek);
      };
      hour.addEventListener("change", save);
      minute.addEventListener("change", save);
      setting.append(entry, preview);
      grid.append(setting);
    }
  }

  function icon(kind) {
    const path = kind === "pin"
      ? '<path d="M12 21s7-5.4 7-11a7 7 0 1 0-14 0c0 5.6 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/>'
      : kind === "clock"
        ? '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
        : '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/>';
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg>`;
  }

  function addMeta(parent, kind, label) {
    const row = make("div", "course-meta");
    row.innerHTML = icon(kind);
    row.append(document.createTextNode(label));
    parent.append(row);
  }

  function drawHeader(week) {
    const head = $("table-head");
    head.replaceChildren();
    const row = document.createElement("tr");
    row.append(make("th", "", "节次 / 星期"));

    schedule.days.forEach((dayName, index) => {
      const heading = document.createElement("th");
      heading.append(make("span", "", dayName));
      if (week > 0) {
        const date = new Date(termStart + ((week - 1) * 7 + index) * 86400000);
        heading.append(make("span", "day-date",
          `${date.getUTCMonth() + 1} 月 ${date.getUTCDate()} 日`));
        if (date.getTime() === todayInShanghai()) heading.classList.add("is-today");
      }
      row.append(heading);
    });
    head.append(row);
  }

  function drawCourses(week) {
    drawHeader(week);
    const body = $("table-body");
    body.replaceChildren();
    let count = 0;

    for (const slot of schedule.slots) {
      const [groupFirst, groupLast] = slot.id.split("-").map(Number);
      const row = document.createElement("tr");
      const heading = make("th", "", slot.label);
      heading.append(make("span", "slot-time",
        slotTimeRange(groupFirst, groupFirst, groupLast) || "--:--—--:--"));
      row.append(heading);

      for (let day = 1; day <= 7; day++) {
        const cell = document.createElement("td");
        const items = schedule.courses.filter(course =>
          course.day === day && course.slot === slot.id &&
          (week === 0 || course.weekNumbers.includes(week))
        );
        if (!items.length) cell.className = "empty";
        const container = make("div", week === 0 ? "period-list" : "period-grid");

        if (week !== 0) {
          container.style.setProperty("--rows", String(groupLast - groupFirst + 1));
          for (let period = groupFirst; period <= groupLast; period++) {
            const guide = make("div", "period-guide");
            guide.style.gridRow = String(period - groupFirst + 1);
            container.append(guide);
          }
        }

        for (const course of items) {
          count++;
          const match = course.periods.match(/(\d+)(?:[–-](\d+))?/);
          const first = Number(match?.[1] || groupFirst);
          const last = Number(match?.[2] || match?.[1] || groupLast);
          const time = slotTimeRange(groupFirst, first, last);
          const card = make("article", "course");
          card.dataset.tone = course.tone;
          card.dataset.duration = String(last - first + 1);
          card.title = `${course.name} · ${course.weeks} · ${course.periods}${time ? ` · ${time}` : ""} · ${course.room}`;
          if (week !== 0) card.style.gridRow = `${first - groupFirst + 1} / span ${last - first + 1}`;
          card.append(make("p", "course-name", course.name));
          if (week === 0) addMeta(card, "calendar", course.weeks);
          if (week === 0 && time) addMeta(card, "clock", time);
          addMeta(card, "pin", course.room);
          card.append(make("div", "course-code", `课程代码 ${course.code}`));

          if (week === 0) {
            const rail = make("div", "period-rail");
            rail.setAttribute("aria-label", `${course.periods}，共 ${last - first + 1} 节`);
            for (let period = groupFirst; period <= groupLast; period++) {
              rail.append(make("span", period >= first && period <= last ? "active" : ""));
            }
            card.append(rail);
          }
          container.append(card);
        }

        cell.append(container);
        row.append(cell);
      }
      body.append(row);
    }

    if (!match) return NaN;
    const [, year, month, day, hour, minute] = match.map(Number);
    if (month < 1 || month > 12 || hour > 23 || minute > 59) return NaN;
    if (new Date(Date.UTC(year, month - 1, day)).getUTCDate() !== day) return NaN;
    return Date.parse(`${match[1]}-${match[2]}-${match[3]}T${match[4]}:${match[5]}:00+08:00`);
  }

    return manualAssignments.flatMap((item, index) => {
      if (!item || typeof item.course !== "string" || typeof item.content !== "string") return [];
      const id = `file-${index}`;
      if (fileRemoved.has(id)) return [];
      const deadline = parseShanghaiTime(item.deadline);
      if (!Number.isFinite(deadline)) return [];
      const base = {
        id,
        source: "file",
        course: item.course,
        deadline,
        content: item.content,
        address: typeof item.address === "string" ? item.address : ""
      };

    });

        return;
      }

        fileOverrides[editingId] = { course, content, address, deadline };

      resetForm();
      renderDDL();

      if (!$("ddl-root").classList.contains("hidden")) renderDDL();

      if (!document.hidden && !$("ddl-root").classList.contains("hidden")) renderDDL();
    });

})();

    } else {
      localWebsites = localWebsites.filter(value => value.id !== id);
      saveLocalWebsites();
    }
    manualOrder = manualOrder.filter(value => value !== id);
    saveOrder();
    resetForm();
    renderWebsite();
  }

  function initWebsite() {
    localWebsites = readLocalWebsites();
    manualOrder = readOrder();
    fileOverrides = readFileOverrides();
    fileRemoved = readFileRemoved();
    setupDragAndDrop();
    $("website-add-button").addEventListener("click", () => {
      resetForm();
      $("website-form").classList.remove("hidden");
      $("website-name").focus();
    });
    $("website-form").addEventListener("submit", event => {
      event.preventDefault();
      const name = $("website-name").value.trim();
      const url = normalizeUrl($("website-url").value.trim());
      const note = $("website-note").value.trim();
      if (!name || !url) {
        putText("website-status", "请填写名称和有效的 http/https 网址。");
        return;
      }
      if (editingId && editingSource === "file") {
        // 编辑 data.js 里的条目：存为本地覆盖，不改源文件
        fileOverrides[editingId] = { name, url, note };
        saveFileOverrides();
        putText("website-status", "已保存修改（仅当前浏览器）。");
      } else {
        const item = { id: editingId || crypto.randomUUID(), name, url, note };
        if (editingId) localWebsites = localWebsites.map(value => value.id === editingId ? item : value);
        else localWebsites.push(item);
        saveLocalWebsites();
      }
      resetForm();
      renderWebsite();
    });
    $("website-cancel").addEventListener("click", resetForm);
    $("website-delete").addEventListener("click", deleteEditing);
    renderWebsite();
  }

  function setupDragAndDrop() {
    const list = $("website-list");

    list.addEventListener("dragstart", event => {
      const row = event.target.closest("tr[data-id]");
      if (!row) return;
      dragRow = row;
      justDragged = true;
      row.classList.add("dragging");
      event.dataTransfer.effectAllowed = "move";
      try { event.dataTransfer.setData("text/plain", row.dataset.id); } catch {}
    });

    list.addEventListener("dragover", event => {
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      const target = event.target.closest("tr[data-id]");
      if (!target || target === dragRow) return;
      const rect = target.getBoundingClientRect();
      const after = event.clientY > rect.top + rect.height / 2;
      target.parentNode.insertBefore(dragRow, after ? target.nextSibling : target);
    });

    list.addEventListener("drop", event => event.preventDefault());

    list.addEventListener("dragend", () => {
      if (!dragRow) return;
      dragRow.classList.remove("dragging");
      dragRow = null;
      // 按当前 DOM 顺序记录
      manualOrder = [...list.querySelectorAll("tr[data-id]")].map(row => row.dataset.id);
      saveOrder();
      // 稍后清除标记，避免拖动结束后误触发"点击编辑"
      setTimeout(() => { justDragged = false; }, 60);
    });
  }

  function clearWebsite() {
    resetForm();
  }

  // 暴露给其他模块使用
  __RA.renderWebsite = renderWebsite;
  __RA.initWebsite = initWebsite;
  __RA.clearWebsite = clearWebsite;
})();

// ===== main/main.js =====
(function () {
  const {  encrypted, quickEncrypted  } = __RA;
  const {  initClass, renderClass, clearClass  } = __RA;
  const {  initDDL, renderDDL, clearDDL  } = __RA;
  const {  initWebsite, renderWebsite, clearWebsite  } = __RA;
  const {  $, putText  } = __RA;

  const themeStorageKey = "ranqi.theme.v1";

  const SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M4.4 4.4l1.6 1.6M18 18l1.6 1.6M2.6 12h2.2M19.2 12h2.2M4.4 19.6L6 18M18 6l1.6-1.6"/></svg>';
  const MOON_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.4 14.2A8.6 8.6 0 0 1 9.8 3.6a8.7 8.7 0 1 0 10.6 10.6Z"/></svg>';

  function setTheme(theme) {
    document.documentElement.dataset.theme = theme;
    for (const button of document.querySelectorAll("[data-theme-toggle]")) {
      // 当前是夜间 → 显示太阳（点击切回白天）；当前是白天 → 显示月亮
      const isDark = theme === "dark";
      button.innerHTML = isDark ? SUN_ICON : MOON_ICON;
      button.setAttribute("aria-label", isDark ? "切换到白天模式" : "切换到夜间模式");
      button.setAttribute("title", isDark ? "切换到白天模式" : "切换到夜间模式");
      button.classList.add("theme-icon-button");
    }
    try { localStorage.setItem(themeStorageKey, theme); } catch {}
  }

  function showView(view) {
    $("class-root").classList.toggle("hidden", view !== "class");
    $("ddl-root").classList.toggle("hidden", view !== "ddl");
    $("website-root").classList.toggle("hidden", view !== "website");

    if (view === "ddl") renderDDL();
    if (view === "website") renderWebsite();

    const placeholder = ["one", "two", "three"].includes(view);
    $("placeholder-view").classList.toggle("hidden", !placeholder);
    if (placeholder) {
      const number = { one: 1, two: 2, three: 3 }[view];
      putText("placeholder-title", `板块${["", "一", "二", "三"][number]}`);
      putText("placeholder-badge", String(number).padStart(2, "0"));
    }

    for (const button of document.querySelectorAll(".nav-button")) {
      const active = button.dataset.view === view;
      button.classList.toggle("active", active);
      if (active) button.setAttribute("aria-current", "page");
      else button.removeAttribute("aria-current");
    }
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  const decode = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));

  async function unlock(password, payload = encrypted) {
    const bytes = new TextEncoder().encode(password);
    const source = await crypto.subtle.importKey("raw", bytes, "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: decode(payload.salt), iterations: payload.iterations, hash: "SHA-256" },
      source,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: decode(payload.iv) },
      key,
      decode(payload.data)
    );
    return JSON.parse(new TextDecoder().decode(plain));
  }

  function updateLoginMode() {
    const quick = $("username").value.trim() === "1";
    $("password-field").classList.toggle("hidden", quick);
    $("password").required = !quick;
    if (quick) $("password").value = "";
    $("login-button").textContent = quick ? "快速进入" : "进入学习空间";
  }


  async function start() {
    let savedTheme = "light";
    try { if (localStorage.getItem(themeStorageKey) === "dark") savedTheme = "dark"; } catch {}
    setTheme(savedTheme);

  

    initClass();
    initDDL();
    initWebsite();

    for (const button of document.querySelectorAll("[data-theme-toggle]")) {
      button.addEventListener("click", () => {
        setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
      });
    }

    $("username").addEventListener("input", updateLoginMode);
    $("login-form").addEventListener("submit", async event => {
      event.preventDefault();
      putText("login-error", "");
      const button = $("login-button");
      button.disabled = true;
      button.textContent = "正在验证…";
      try {
        const username = $("username").value.trim();
        let data;
        if (username === "1") data = await unlock("1", quickEncrypted);
        else if (username === "ranqi") data = await unlock($("password").value);
        else throw new Error("invalid");

        renderClass(data);
        putText("term", data.term);
        putText("student", data.student);
        showView("class");
        $("login").classList.add("hidden");
        $("app").classList.remove("hidden");
        $("app").removeAttribute("aria-hidden");
        $("password").value = "";
      } catch {
        putText("login-error", "用户名或密码不正确");
        $("password").value = "";
        ( $("username").value.trim() === "1" ? $("username") : $("password") ).focus();
      } finally {
        button.disabled = false;
        updateLoginMode();
      }
    });

    for (const button of document.querySelectorAll(".nav-button")) {
      button.addEventListener("click", () => showView(button.dataset.view));
    }

    $("logout").addEventListener("click", () => {
      clearClass();
      clearDDL();
      clearWebsite();
      $("app").classList.add("hidden");
      $("app").setAttribute("aria-hidden", "true");
      $("login").classList.remove("hidden");
      $("login-form").reset();
      updateLoginMode();
      $("username").focus();
    });
  }

  start().catch(error => {
    console.error(error);
    putText("login-error", "页面文件加载失败。请确认 main、class、DDL、website 文件夹都已上传。");
    $("login-button").disabled = true;
  });
})();
</script>
</body>
